<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login -QuizMaster</title>
<link rel="stylesheet" href="Login.css">
</head>
<body>


    <!-- =========================================================
         NAVBAR
         ========================================================= -->

    <header>

        <nav>

            <a href="Home.html">
                Home
            </a>

            <a href="Quiz.html">
                Quiz
            </a>
            <a href="Dashboard.html">
                Dashboard
            </a>

            <a href="Contact.html">
                Contact
            </a>


        </nav>

    </header>


    <!-- =========================================================
         LOGIN PAGE
         ========================================================= -->

    <main class="login-page">

        <div class="login-container">

            <div class="login-card">


                <!-- LOGIN HEADER -->

                <div class="login-header">

                    <div class="login-logo">
                        Quiz<span>Master</span>
                    </div>

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Login to continue your quiz journey
                    </p>

                </div>


                <!-- LOGIN FORM -->

                <form>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-box">

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >

                        </div>

                    </div>


                    <!-- REMEMBER + FORGOT -->

                    <div class="password-row">

                        <label class="remember">

                            <input
                                type="checkbox"
                            >

                            Remember me

                        </label>


                        <a
                            href="#"
                            class="forgot-password"
                        >
                            Forgot Password?
                        </a>

                    </div>


                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="login-btn"
                    >
                        Login
                    </button>


                </form>


                <!-- DIVIDER -->

                <div class="divider">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- SIGN UP -->

                <div class="signup-text">
                    
                    Don't have an account?

                    <a href="Sinup.html">
                        Create Account
                    </a>

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <footer>

            © 2026 QuizMaster. All Rights Reserved.

        </footer>

    </main>


</body>
</html>
